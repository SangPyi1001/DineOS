<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineOS Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="app-header">
        <div class="header-top">
            <button class="menu-btn" onclick="openSidebar()">☰</button>
            <h1>DineOS Menu</h1>
            <div style="width: 24px;"></div> <!-- Alignment Balance -->
        </div>

        <div id="noticeBanner" class="notice-banner" style="display:none;"></div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ဟင်းပွဲများ ရှာရန်...">
        </div>

        <div id="categoriesBar" class="categories-bar"></div>
    </header>

    <!-- 🚀 Slidebar (Navigation Drawer) Section -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="closeSidebar()"></div>
    
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>DineOS</h2>
            <button class="close-btn" onclick="closeSidebar()">&times;</button>
        </div>
        <div class="sidebar-content">
            <ul class="sidebar-menu">
                <li onclick="closeSidebar(); filterByCategory('All');">🏠 ပင်မစာမျက်နှာ (Home)</li>
                <li onclick="closeSidebar(); fetchMenuFromTelegram();">🔄 Menu Refresh လုပ်ရန်</li>
                <li onclick="closeSidebar(); alert('DineOS Order System v1.0');">ℹ️ App အကြောင်း</li>
            </ul>
        </div>
    </aside>

    <!-- Main Content -->
    <main>
        <div id="menuGrid" class="menu-grid"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
